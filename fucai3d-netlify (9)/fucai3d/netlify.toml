# Netlify 部署配置
# 部署方法:把整个目录拖到 https://app.netlify.com/drop 即可

[build]
  publish = "."

# SPA 路由 fallback(让 /sub.html 等能直接访问)
[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

# 安全 headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 缓存静态资源 1 天
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
