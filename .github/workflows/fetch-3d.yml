name: 抓取福彩3D最新开奖数据

on:
  schedule:
    - cron: "20 13 * * *"  # 21:20 北京
  workflow_dispatch:

jobs:
  fetch-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sfL --max-time 20 "https://www.17500.cn/getData/3d.TXT" -o /tmp/raw.txt
          ls -la /tmp/raw.txt
      - run: |
          python3 << 'EOF'
          import json, os
          raw = open('/tmp/raw.txt').read()
          items = []
          for line in raw.strip().split('\n'):
              p = line.split()
              if len(p) < 5: continue
              try: a,b,c = int(p[2]),int(p[3]),int(p[4])
              except: continue
              if len(p[0]) != 7: continue
              items.append({'p':p[0],'d':p[1],'a':a,'b':b,'c':c,
                  'sum':a+b+c,'span':max(a,b,c)-min(a,b,c),
                  'type':'组三' if (a==b or b==c or a==c) else '组六'})
          items.sort(key=lambda x:int(x['p']),reverse=True)
          out = {'fetchedAt':'auto','count':len(items[:5]),'data':items[:5]}
          os.makedirs('fucai3d-netlify (13)/fucai3d', exist_ok=True)
          json.dump(out, open('fucai3d-netlify (13)/fucai3d/latest.json','w'), ensure_ascii=False, indent=2)
          print(f"wrote {len(items[:5])} periods")
          EOF
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "fucai3d-netlify (13)/fucai3d/latest.json"
          git diff --cached --quiet || (git commit -m "auto: 抓取" && git push)
