# Netlify 部署配置
# 部署方法:把整个目录拖到 https://app.netlify.com/drop 即可

[build]
  publish = "."

# SPA 路由 fallback(让 /sub.html 等能直接访问)
[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

# 安全 headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 缓存配置(v5.7.7.3)
# data.js: 每次重下(无缓存),保证新部署立即生效
# 其他 js/css: 5 分钟缓存(平衡速度 vs 新版本)
[[headers]]
  for = "/js/data.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
