name: 抓取福彩3D最新开奖数据

on:
  schedule:
    - cron: '18 13 * * *'
  workflow_dispatch:
    inputs:
      pagesize:
        description: 抓几期
        default: '5'

jobs:
  fetch-3d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 抓取数据
        id: fetch
        run: |
          PAGESIZE="${{ github.event.inputs.pagesize || 5 }}"
          curl -sf "https://api.allorigins.win/raw?url=https%3A%2F%2Fm.500.com%2Findex.php%3Fc%3Dkaijiang%26a%3DajaxLoadMoreExpect%26lot%3Dsd%26page%3D1%26pagesize%3D${PAGESIZE}" -o /tmp/raw.json || curl -sf "https://m.500.com/index.php?c=kaijiang&a=ajaxLoadMoreExpect&lot=sd&page=1&pagesize=${PAGESIZE}" -o /tmp/raw.json

      - name: 解析 + 写文件
        run: |
          python3 << 'PYEOF'
          import json, re
          with open('/tmp/raw.json', 'r', encoding='utf-8') as f:
              raw = f.read()
          items = []
          if raw.strip().startswith('{'):
              try:
                  data = json.loads(raw)
                  if data.get('code') == '100' and 'data' in data:
                      result = data['data'].get('result', '')
                      pattern = r'kaij-tit[^>]*>(\d+)期<em>([\d\-]+).*?red-(?:ball|txt)"[^>]*>(\d+)</li>\s*<li class="red-(?:ball|txt)"[^>]*>(\d+)</li>\s*<li class="red-(?:ball|txt)"[^>]*>(\d+)</li>'
                      for m in re.finditer(pattern, result, re.DOTALL):
                          items.append({'p': m.group(1), 'd': m.group(2), 'a': int(m.group(3)), 'b': int(m.group(4)), 'c': int(m.group(5))})
              except Exception as e:
                  print(f"JSON 解析失败: {e}")
          if not items:
              print("❌ 没抓到数据")
              exit(1)
          for it in items:
              a, b, c = it['a'], it['b'], it['c']
              it['sum'] = a + b + c
              it['span'] = max(a, b, c) - min(a, b, c)
              it['type'] = '组三' if (a == b or b == c or a == c) else '组六'
          output = {'fetchedAt': '2026-08-08T13:18:00Z', 'count': len(items), 'data': items}
          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(f"✅ 抓到 {len(items)} 期")
          PYEOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || (git commit -m "auto: 抓取福彩3D最新数据 $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)
