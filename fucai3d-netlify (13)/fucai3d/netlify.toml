# Netlify 部署配置

[build]
  publish = "."

# SPA 路由 fallback
[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

# 安全 headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# js/css 1 小时缓存(秒开)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# 主 HTML no-cache
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# data.js no-cache
[[headers]]
  for = "/js/data.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# latest.json no-cache
[[headers]]
  for = "/latest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
