# Netlify 部署配置

[build]
  publish = "."

# SPA 路由 fallback
[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

# 安全 headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# js/css 1 小时缓存(秒开)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# 主 HTML no-cache
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# data.js no-cache
[[headers]]
  for = "/js/data.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# latest.js no-cache(v5.8.8:重要 — 改 next.drawTime 等逻辑必须立刻生效)
[[headers]]
  for = "/js/latest.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# main.js no-cache(v5.8.9:用户常看到旧版 — 改 UI 必须立刻生效)
[[headers]]
  for = "/js/main.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# service-worker.js no-cache(v5.8.11:SW 更新必须立刻生效)
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# auth.js no-cache
[[headers]]
  for = "/js/auth.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# formulas.js no-cache
[[headers]]
  for = "/js/formulas.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# netlifyBackend.js no-cache
[[headers]]
  for = "/js/netlifyBackend.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# tokenAuth.js no-cache
[[headers]]
  for = "/js/tokenAuth.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# latest.json no-cache
[[headers]]
  for = "/latest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
