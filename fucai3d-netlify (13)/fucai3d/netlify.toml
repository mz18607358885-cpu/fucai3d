# Netlify 部署配置
# 部署方法:把整个目录拖到 https://app.netlify.com/drop 即可

[build]
  publish = "."

# SPA 路由 fallback(让 /sub.html 等能直接访问)
[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

# 安全 headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 缓存:JS/CSS 用 hash 文件名(没 hash → 短缓存;主 HTML 始终 no-cache)
# v5.7.7.2:改成短缓存 5 分钟,避免代码改了但 CDN 还是返回旧版
[[headers]]
  for = "/js/data.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
